[project]
name = "og-eowi"
version = "0.1.0"
description = "End-of-Well Intelligence demo"
requires-python = ">=3.11"
dependencies = [
  "bm25s>=0.2.0",
  "cohere>=5.0.0",
  "duckdb>=1.0.0",
  "fastapi>=0.136.3",
  "lancedb>=0.30.2",
  "pdfplumber>=0.11.0",
  "pydantic>=2.6.0",
  "pymupdf>=1.27.2.3",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.3",
  "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.8.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "data",
  "frontend",
  ".git",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
