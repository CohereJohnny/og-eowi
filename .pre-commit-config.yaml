default_install_hook_types:
  - pre-commit
  - pre-push

exclude: ^(\.cursor/|data/|eval/runs/|.*\.tsbuildinfo$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=10240"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prevent-local-env
        name: prevent local env files from being staged
        language: system
        entry: bash -c 'if git diff --cached --name-only | grep -E "^(.env|.env.local|.*\\.pem|.*\\.key)$"; then echo "Refusing to commit local secrets or key files"; exit 1; fi'
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend typecheck
        language: system
        entry: npm --prefix frontend run typecheck
        pass_filenames: false
        stages: [pre-push]

      - id: backend-tests
        name: backend tests
        language: system
        entry: python3 -m pytest
        pass_filenames: false
        stages: [pre-push]
