name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --all-groups

      - name: Ruff check
        run: uv run ruff check backend scripts

      - name: Ruff format check
        run: uv run ruff format --check backend scripts

      - name: Backend tests
        run: uv run pytest

      - name: Eval smoke test
        run: uv run python scripts/eval_run.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir frontend run typecheck

      - name: Build
        run: pnpm --dir frontend run build

  config-and-security:
    name: Config and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Docker Compose config
        run: docker compose config

      - name: Secret pattern scan
        run: |
          secret_pattern='COHERE_API''_KEY=[^[:space:]$][^[:space:]]*|BEGIN (RSA|OPENSSH|PRIVATE) KEY'
          if git grep -n -E "$secret_pattern" -- ':!*.md' ':!frontend/pnpm-lock.yaml' ':!uv.lock'; then
            echo "Potential secret found in tracked files"
            exit 1
          fi

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
