name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Ruff check
        run: ruff check backend scripts

      - name: Ruff format check
        run: ruff format --check backend scripts

      - name: Backend tests
        run: python -m pytest

      - name: Eval smoke test
        run: python scripts/eval_run.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Build
        run: npm --prefix frontend run build

  config-and-security:
    name: Config and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Docker Compose config
        run: docker compose config

      - name: Secret pattern scan
        run: |
          if git grep -n -E '(COHERE_API_KEY=.+|BEGIN (RSA|OPENSSH|PRIVATE) KEY)' -- ':!*.md' ':!frontend/package-lock.json'; then
            echo "Potential secret found in tracked files"
            exit 1
          fi

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
